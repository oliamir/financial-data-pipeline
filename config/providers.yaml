providers:
  gemini:
    type: google
    model: gemini-2.0-flash
    api_key_env: GOOGLE_API_KEY
    max_retries: 3
    rate_limit_delay: 10

  ollama:
    type: ollama
    model: qwen2.5:7b
    host_env: OLLAMA_HOST
    host_default: "http://localhost:11434"
    fallback_model: llama3.1
    auto_detect_models: true

  anthropic:
    type: anthropic
    model: claude-3-5-sonnet-20241022
    api_key_env: ANTHROPIC_API_KEY
    enabled: false

  openai:
    type: openai
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    enabled: false

routing:
  classify:
    primary: ollama
    fallback: [gemini]
  extract:
    primary: ollama
    fallback: [gemini]
    validation: gemini
  memo:
    primary: gemini
    fallback: [ollama]
  research:
    primary: gemini
    fallback: []
