[tool.poetry]
name = "finance"
version = "0.1.0"
description = "Financial data pipeline -- automated scraping and AI analysis of TASE company reports"
authors = ["Amir Oliker"]
readme = "README.md"
packages = [{include = "src"}, {include = "cli"}]

[tool.poetry.scripts]
finance = "cli.main:app"

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.6"
pydantic-settings = "^2.2"
typer = {extras = ["all"], version = "^0.12"}
rich = "^13.7"
pyyaml = "^6.0"
python-dotenv = "^1.0"
pdfplumber = "^0.11"
pandas = "^2.2"
openpyxl = "^3.1"
playwright = "^1.44"
beautifulsoup4 = "^4.12"
requests = "^2.31"
httpx = "^0.27"
google-generativeai = "^0.8"
ollama = "^0.3"
anthropic = "^0.34"
openai = "^1.40"
flask = "^3.0"
flask-socketio = "^5.3"
google-auth-oauthlib = "^1.2"
google-api-python-client = "^2.142"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
ruff = "^0.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
